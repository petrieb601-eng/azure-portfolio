<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bryan Petrie{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..700;1,62..125,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-nav">
        <nav class="nav-container" aria-label="Main">
            <a href="/" class="brand">Bryan Petrie</a>
            <ul class="nav-links">
                <li><a href="/research">Research</a></li>
                <li><a href="/projects">Projects</a></li>
                <li><a href="/#tools">Tools</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="{{ url_for('static', filename='Bryan_Petrie_Resume.pdf') }}" target="_blank" rel="noopener">Résumé</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>&copy; 2026 Bryan Petrie</span>
            <span><a href="mailto:Petrieb601@gmail.com">Petrieb601@gmail.com</a> &nbsp; <a href="https://github.com/petrieb601-eng" target="_blank" rel="noopener">GitHub</a></span>
            <span>Built with Flask on Azure App Service</span>
        </div>
    </footer>

    <script>
    /* Mark the current page in the nav */
    (function () {
        var path = location.pathname;
        document.querySelectorAll('.nav-links a').forEach(function (a) {
            var href = a.getAttribute('href');
            if (href.charAt(0) !== '/' || href.indexOf('#') !== -1) return;
            if (href === path || (href !== '/' && path.indexOf(href) === 0)) a.setAttribute('aria-current', 'page');
        });
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
